name: Install Test

on:
  push:
    branches: [main]
    paths:
      - '.bin/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - '.github/workflows/install-test.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # 毎週月曜 18:00 JST

permissions:
  contents: read

jobs:
  nix-build:
    name: Nix build check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f # v31.10.5
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Check flake
        run: nix flake check --impure

      - name: Build darwin configuration (dry-run)
        run: nix build .#darwinConfigurations.default.system --dry-run --impure

  setup-test:
    name: Setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14 # Sonoma
          - macos-15 # Sequoia
          - ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup test environment
        run: |
          TEST_HOME="${{ runner.temp }}/test-home"
          mkdir -p "$TEST_HOME"
          echo "TEST_HOME=$TEST_HOME" >> $GITHUB_ENV

      - name: Run setup.sh
        run: HOME="$TEST_HOME" bash .bin/setup.sh

      - name: Verify symlinks
        run: |
          echo "=== Symlinks created ==="
          ls -la "$TEST_HOME" | grep "^l" || echo "No symlinks found"
          echo ""
          echo "=== .config contents ==="
          ls -la "$TEST_HOME/.config" 2>/dev/null || echo "No .config directory"
          echo ""
          echo "=== .dotbackup contents ==="
          ls -la "$TEST_HOME/.dotbackup" 2>/dev/null || echo "No backup directory"
