name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # 毎週月曜 18:00 JST

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Nix devShell)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: cachix/install-nix-action@56bf1f1714bec41f77fcb42ba1c179eeca2172cb # v30
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Run all linters
        run: nix develop --command make _lint
